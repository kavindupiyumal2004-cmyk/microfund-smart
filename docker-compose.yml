services:
  mysql:
    image: mysql:8.4
    container_name: microfund-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: microfund_db
    ports:
      - "3306:3306"
    volumes:
      - microfund_mysql_data:/var/lib/mysql
      - ./backend/database/microfund_complete.sql:/docker-entrypoint-initdb.d/01-microfund.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: microfund-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  microfund_mysql_data:
